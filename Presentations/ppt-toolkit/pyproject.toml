[project]
name = "ppt-toolkit"
version = "0.1.0"
description = "Render AI-generated deck content into a White/McKinsey-style or WB-branded PowerPoint, and convert existing decks between the two."
requires-python = ">=3.9"
dependencies = [
    "python-pptx>=0.6.23",
    "jsonschema>=4.0",
]

[project.scripts]
ppt = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

